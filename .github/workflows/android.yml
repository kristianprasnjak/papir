name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Testovi
        run: gradle testDebugUnitTest --no-daemon

      - name: Izgradnja APK-a
        run: gradle assembleDebug --no-daemon

      - name: Priprema
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk papir.apk
          echo "VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: papir-apk
          path: papir.apk

      - name: Izdanje za mobitel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: Papir ${{ env.VERSION }} (build ${{ github.run_number }})
          prerelease: true
          files: papir.apk
          body: |
            Instalacija: preuzmi `papir.apk` na Android mobitelu i otvori ga.
            Commit: ${{ github.sha }}
